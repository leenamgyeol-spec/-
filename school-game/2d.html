<title>지각 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen arcade — mission card on top, the real floor plan as the playfield, contextual stair buttons at the bottom. Single deliberate "blackboard" look. */
:root {
  --board: #1d2b25;
  --board-2: #263a31;
  --chalk: #f1eee4;
  --chalk-dim: #a9b8ae;
  --bell: #f3c332;
  --late: #e65a4b;
  --go: #6fcf8e;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--board); color: var(--chalk); font-family: var(--body);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
}
#app { height: 100%; display: flex; flex-direction: column; }
header {
  display: flex; gap: 12px; align-items: stretch;
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.period {
  font-family: var(--display); font-size: 15px; letter-spacing: .04em;
  background: var(--bell); color: var(--board); border-radius: 6px;
  padding: 6px 10px; display: grid; place-items: center; min-width: 58px; text-align: center; line-height: 1.1;
}
.period b { display: block; font-size: 26px; font-weight: 400; }
.mission { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.mission .flavor { font-size: 13px; color: var(--chalk-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mission .goal { font-family: var(--display); font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mission .goal small { font-family: var(--body); font-size: 13px; color: var(--bell); margin-left: 6px; }
.clock { display: grid; place-items: center; min-width: 64px; font-family: var(--display); font-size: 30px; font-variant-numeric: tabular-nums; }
.clock.urgent { color: var(--late); animation: shake .4s infinite; }
@keyframes shake { 50% { transform: translateX(1px) rotate(-2deg); } }
.bar { height: 4px; background: var(--board-2); margin: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--bell); transform-origin: left; }
main { flex: 1; position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.floorTag {
  position: absolute; top: 10px; left: max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--display); font-size: 40px; color: var(--board); background: var(--chalk);
  padding: 0 10px; border-radius: 6px; line-height: 1.2; pointer-events: none;
}
.hintBtn {
  position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px));
  font: 15px var(--display); background: var(--board-2); color: var(--chalk);
  border: 1px solid var(--chalk-dim); border-radius: 6px; padding: 8px 12px; cursor: pointer;
}
.stairs {
  position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; gap: 12px; pointer-events: none;
}
.stairs button {
  pointer-events: auto; font: 22px var(--display); border: 0; border-radius: 8px; cursor: pointer;
  padding: 12px 20px; background: var(--bell); color: var(--board); box-shadow: 0 4px 0 #a9851b;
}
.stairs button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a9851b; }
button:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  font: 44px var(--display); color: var(--bell); text-shadow: 0 3px 0 var(--board);
  pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap;
}
.toast.on { opacity: 1; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20, 31, 26, .88);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: left; }
.card h1 { font: 64px/1 var(--display); margin: 0; color: var(--chalk); text-wrap: balance; }
.card h1 em { font-style: normal; color: var(--bell); }
.card p { margin: 0; line-height: 1.6; color: var(--chalk-dim); font-size: 15px; }
.card ol { margin: 0; padding-left: 20px; line-height: 1.7; font-size: 15px; }
.card kbd { font-family: var(--body); border: 1px solid var(--chalk-dim); border-radius: 4px; padding: 0 5px; font-size: 13px; }
.card .big {
  font: 26px var(--display); background: var(--bell); color: var(--board); border: 0; border-radius: 8px;
  padding: 14px; cursor: pointer; box-shadow: 0 5px 0 #a9851b;
}
.card .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #a9851b; }
.card .best { font-size: 14px; color: var(--chalk-dim); }
.stamp { font: 22px var(--display); color: var(--late); border: 3px solid var(--late); border-radius: 6px; padding: 2px 10px; align-self: flex-start; transform: rotate(-4deg); }
.stamp.ok { color: var(--go); border-color: var(--go); }
@media (prefers-reduced-motion: reduce) { .clock.urgent { animation: none; } .toast { transition: none; } }
</style>

<div id="app">
  <header>
    <div class="period"><span><b id="periodNo">1</b>교시</span></div>
    <div class="mission">
      <div class="flavor" id="flavor">등교 완료. 종이 울리기 전에!</div>
      <div class="goal" id="goal">—</div>
    </div>
    <div class="clock" id="clock">⏰</div>
  </header>
  <div class="bar"><i id="barFill"></i></div>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="floorTag" id="floorTag">1F</div>
    <button class="hintBtn" id="hintBtn" type="button">길 안내 (−5초)</button>
    <div class="stairs" id="stairs" hidden>
      <button type="button" id="upBtn">▲ 2층</button>
      <button type="button" id="downBtn">▼ 1층</button>
    </div>
    <div class="toast" id="toast"></div>
    <div class="overlay" id="startOv">
      <div class="card">
        <h1>지각<br><em>탈출</em></h1>
        <p>종이 울리기 전에 우리 학교 도면 속 목적지로 달려가세요. 하루 7교시를 모두 통과하면 하교!</p>
        <ol>
          <li>이동: <kbd>←↑↓→</kbd> / <kbd>WASD</kbd>, 휴대폰은 화면을 누른 채 끌기</li>
          <li>계단·엘리베이터 위에서 <kbd>Q</kbd> 위층, <kbd>E</kbd> 아래층 (또는 노란 버튼)</li>
          <li>목적지 교실 문 앞에 닿으면 출석 체크</li>
        </ol>
        <button class="big" id="startBtn" type="button">등교하기</button>
        <div class="best" id="bestStart"></div>
      </div>
    </div>
    <div class="overlay" id="endOv" hidden>
      <div class="card">
        <div class="stamp" id="endStamp">지각</div>
        <h1 id="endTitle">벌점 1점</h1>
        <p id="endText"></p>
        <button class="big" id="againBtn" type="button">다시 등교하기</button>
        <div class="best" id="bestEnd"></div>
      </div>
    </div>
  </main>
</div>

  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem("jigak-best", String(best)); } catch (e) {} }
  $("endStamp").textContent = win ? "출석 완료" : "지각";
  $("endStamp").classList.toggle("ok", win);
  $("endTitle").textContent = win ? "하교!" : S.period + "교시 지각";
  const dn = displayName(S.target.name);
  $("endText").textContent = win
    ? `7교시를 모두 통과했어요. 남긴 시간 ${S.totalSpare}초. 점수 ${score}점.`
    : `${dn}에 늦었어요. ${S.period - 1}교시까지 통과, 점수 ${score}점.`;
  $("bestEnd").textContent = (isBest ? "새 최고 기록! " : "") + "최고 " + best + "점";
  $("endOv").hidden = false;
  if (win) chime(); else beep([330, 262], 0.25);
}

// ── 화면 ─────────────────────────────────────────────
let W = 0, H = 0, DPR = 1, scale = 1.6, camX = 0, camY = 0;
function resize() {
  const r = $("stage").getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  scale = Math.max(1.3, Math.min(2.4, Math.min(W / 290, H / 260)));
}
addEventListener("resize", resize);

let last = performance.now(), tPulse = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; tPulse += dt;
  if (S && S.running) {
    const [vx, vy] = inputVec();
    if (vx || vy) {
      const nx = S.x + vx * SPEED * dt, ny = S.y + vy * SPEED * dt;
      const stuck = !free(S.x, S.y);   // 격자 구멍에 끼었을 때 빠져나오기
      const ok = (x, y) => free(x, y) || (stuck && isWalk(x, y));
      if (ok(nx, S.y)) S.x = nx;
      if (ok(S.x, ny)) S.y = ny;
      if (vx) S.face = Math.sign(vx);
    }
    S.timeLeft -= dt;
    if (distRect(S.x, S.y, S.target) <= REACH && floorOf(S.y) === S.target.floor) arrive();
    else if (S.timeLeft <= 0) { S.timeLeft = 0; finish(false); }
  }
  draw(now);
  updateHUD();
  updateStairUI();
  requestAnimationFrame(frame);
}

function updateHUD() {
  if (!S || !S.target) return;
  const t = Math.max(0, Math.ceil(S.timeLeft));
  const c = $("clock"); if (c.textContent !== String(t)) c.textContent = t;
  c.classList.toggle("urgent", S.running && S.timeLeft < 6);
  $("barFill").style.transform = `scaleX(${Math.max(0, S.timeLeft / S.timeMax)})`;
  const f = floorOf(S.y) + "F"; if ($("floorTag").textContent !== f) $("floorTag").textContent = f;
}

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#1d2b25"; ctx.fillRect(0, 0, W, H);
  if (!img.complete) return;
  const px = S ? S.x : START.x, py = S ? S.y : START.y;
  const fl = floorOf(py), [fy0, fy1] = FLOORS[fl];
  // 카메라: 플레이어 추적, 층 경계 안에서
  let tx = px - W / 2 / scale, ty = py - H / 2 / scale;
  const vw = W / scale, vh = H / scale;
  tx = vw >= PLAN_W ? (PLAN_W - vw) / 2 : Math.max(0, Math.min(PLAN_W - vw, tx));
  ty = vh >= fy1 - fy0 ? fy0 - (vh - (fy1 - fy0)) / 2 : Math.max(fy0, Math.min(fy1 - vh, ty));
  if (fade > 0 || !S || Math.abs(camY - ty) > 300) { camX = tx; camY = ty; } else { camX += (tx - camX) * 0.2; camY += (ty - camY) * 0.2; }

  ctx.save();
  ctx.scale(scale, scale); ctx.translate(-camX, -camY);
  // 현재 층만 보여주기
  ctx.save(); ctx.beginPath(); ctx.rect(0, fy0 + 1, PLAN_W, fy1 - fy0 - 2); ctx.clip();
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, fy0, PLAN_W, fy1 - fy0);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0);

  // 계단 표시
  for (const s of STAIRS) if (s.floor === fl) {
    ctx.fillStyle = "rgba(243,195,50,.28)"; ctx.fillRect(s.x0, s.y0, s.x1 - s.x0, s.y1 - s.y0);
    ctx.strokeStyle = "#c99a12"; ctx.lineWidth = 1; ctx.strokeRect(s.x0 + .5, s.y0 + .5, s.x1 - s.x0 - 1, s.y1 - s.y0 - 1);
  }
  // 목적지
  if (S && S.target && S.target.floor === fl) {
    const r = S.target, p = 0.5 + 0.5 * Math.sin(tPulse * 6);
    ctx.fillStyle = `rgba(243,195,50,${0.25 + 0.25 * p})`; ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    ctx.strokeStyle = "#e0a800"; ctx.lineWidth = 2.5; ctx.strokeRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
  }
  // 힌트 경로
  if (S && S.hintPath && now < S.hintUntil) {
    ctx.fillStyle = "rgba(230,90,75,.85)";
    for (let k = 0; k < S.hintPath.length; k += 2) {
      const i = S.hintPath[k], x = (i % GW) * C + 2, y = Math.floor(i / GW) * C + 2;
      if (floorOf(y) === fl) { ctx.beginPath(); ctx.arc(x, y, 1.4, 0, 7); ctx.fill(); }
    }
  }
  // 캐릭터
  drawPlayer(px, py, now);
  ctx.restore();
  ctx.restore();

  // 화면 밖 목적지 방향 화살표
  if (S && S.running && S.target.floor === fl) {
    const r = S.target, cx = ((r.x0 + r.x1) / 2 - camX) * scale, cy = ((r.y0 + r.y1) / 2 - camY) * scale;
    if (cx < 0 || cy < 0 || cx > W || cy > H) {
      const ang = Math.atan2(cy - H / 2, cx - W / 2), m = 28;
      const ex = Math.max(m, Math.min(W - m, W / 2 + Math.cos(ang) * W)), ey = Math.max(m + 50, Math.min(H - m - 60, H / 2 + Math.sin(ang) * H));
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.fillStyle = "#f3c332"; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -10); ctx.lineTo(-3, 0); ctx.lineTo(-8, 10); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // 다른 층이면 안내
  if (S && S.running && S.target.floor !== fl) {
    const dir = S.target.floor > fl ? "▲ " + S.target.floor + "층으로 올라가세요" : "▼ " + S.target.floor + "층으로 내려가세요";
    ctx.font = '18px "Do Hyeon", sans-serif'; const w = ctx.measureText(dir).width + 24;
    ctx.fillStyle = "rgba(29,43,37,.9)"; ctx.fillRect((W - w) / 2, H - 110, w, 34);
    ctx.fillStyle = "#f3c332"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(dir, W / 2, H - 93);
  }
  // 조이스틱
  if (joy) {
    ctx.strokeStyle = "rgba(241,238,228,.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 44, 0, 7); ctx.stroke();
    const jx = joy.x - joy.ox, jy = joy.y - joy.oy, l = Math.hypot(jx, jy) || 1, k = Math.min(44, l);
    ctx.fillStyle = "rgba(243,195,50,.75)"; ctx.beginPath(); ctx.arc(joy.ox + jx / l * k, joy.oy + jy / l * k, 16, 0, 7); ctx.fill();
  }
  if (fade > 0) { ctx.fillStyle = `rgba(29,43,37,${fade})`; ctx.fillRect(0, 0, W, H); fade = Math.max(0, fade - 0.08); }
}

function drawPlayer(x, y, now) {
  const moving = joy || ["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].some(k => keys.has(k));
  const bob = moving && S && S.running ? Math.sin(now / 70) * 0.8 : 0;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x, y + 5, 5, 1.8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#2d5fd3"; ctx.beginPath(); ctx.ellipse(x, y + 1 + bob, 4.2, 4.6, 0, 0, 7); ctx.fill();         // 교복
  ctx.fillStyle = "#ffd9b8"; ctx.beginPath(); ctx.arc(x, y - 4.5 + bob, 3.6, 0, 7); ctx.fill();                 // 얼굴
  ctx.fillStyle = "#2a2018"; ctx.beginPath(); ctx.arc(x, y - 5.6 + bob, 3.7, Math.PI, 0); ctx.fill();            // 머리
  ctx.fillStyle = "#2a2018"; const f = S ? S.face : 1;
  ctx.fillRect(x + f * 1.2 - 0.5, y - 4.6 + bob, 1, 1.1);
  ctx.fillStyle = "#e65a4b"; ctx.fillRect(x - 4.5 * f - 1.5, y - 1 + bob, 3, 4);                                 // 가방
}

// ── 시작 ─────────────────────────────────────────────
$("bestStart").textContent = best ? "최고 기록 " + best + "점" : "";
S = newGame();
$("goal").textContent = "중앙 현관에서 출발";
img.onload = () => { resize(); };
resize();
requestAnimationFrame(frame);
</script>
